[project]
name = "sec10k-and-transcripts"
version = "0.1.0"
description = "Dual-index Pinecone vector store over SEC 10-K filings and S&P 500 earnings call transcripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.75",
    "datasets>=5.0.1",
    "openai>=3.3.1",
    "pinecone[grpc]>=9.1.0",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.0",
    "typer>=0.27.1",
]

[project.scripts]
finvec = "finvec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finvec"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
